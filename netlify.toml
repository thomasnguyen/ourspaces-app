[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_CONVEX_URL = "https://necessary-cobra-892.convex.cloud"
  VITE_CONVEX_SITE_URL = "https://necessary-cobra-892.convex.site"

[[redirects]]
  from = "/api/*"
  to = "https://necessary-cobra-892.convex.site/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
