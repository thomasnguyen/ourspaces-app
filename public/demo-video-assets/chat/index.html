<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>the crew</title>
<style>
/* ───────────────────────────────────────────────────────────────
   The group chat — a generic desktop chat to screen-record for 0:05.
   ?rec=1   flick through the backlog fast, typing bubble, last message lands, hold, loop
   ?thread=receipt  the other thread (0:30): her receipt photo gets buried by three
            messages, none of them about money. Same people, same chrome.
   ?blur=1  blur names + avatars (the "real screen record" look)
   ?title=  override the group name (default "the crew")
   Record at 1200×1120. No network, no brand, no real people.
   ─────────────────────────────────────────────────────────────── */
:root{--side:340px;--bg:#e9edf1;--white:#fff;--line:#e3e6ea;--ink:#111b21;--gray:#667781;--faint:#8696a0;--me:#2f7cf6;--me-ink:#fff;--badge:#25a95b;--field:#f0f2f5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:14.5px/1.35 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
b{font-weight:600}
.ico{display:inline-flex;color:var(--faint);flex:none}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.av{border-radius:50%;overflow:hidden;flex:none;display:block;background:#cfd6dc}
.av svg{display:block;width:100%;height:100%}
.s28{width:28px;height:28px}.s36{width:36px;height:36px}.s40{width:40px;height:40px}.s48{width:48px;height:48px}

.app{display:flex;width:1200px;height:1120px;background:var(--white)}

/* sidebar */
.side{width:var(--side);flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--white)}
.sh{height:64px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--field)}
.sh .ico{margin-left:auto}.sh .ico+.ico{margin-left:0}
.search{margin:8px 12px;height:36px;border-radius:8px;background:var(--field);display:flex;align-items:center;gap:10px;padding:0 12px;color:var(--faint);font-size:14px}
.search svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.chats{flex:1;overflow:hidden}
.chat{display:flex;align-items:center;gap:14px;padding:11px 14px;height:74px;border-bottom:1px solid #f1f3f5}
.chat.on{background:var(--field)}
.chat .c{flex:1;min-width:0}
.chat .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chat .r1 .nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .r1 .t{font-size:12px;color:var(--faint);flex:none}
.chat .r1 .t.on{color:var(--badge)}
.chat .r2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.chat .r2 .p{font-size:13.5px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .r2 .p b{font-weight:400}
.chat.on .r2 .p,.chat.un .r2 .p{color:var(--ink)}
.badge{flex:none;min-width:20px;height:20px;border-radius:10px;background:var(--badge);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px}

/* pane */
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.ph{height:64px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--field);border-bottom:1px solid var(--line)}
.ph .c{flex:1;min-width:0}
.ph .title{font-size:16px;font-weight:600}
.ph .mem{font-size:13px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .ico{margin-left:14px}
.msgs{flex:1;overflow-y:auto;padding:14px 64px 12px 24px;display:flex;flex-direction:column;gap:3px;overflow-anchor:none}
.day{align-self:center;background:var(--white);color:var(--gray);font-size:12px;font-weight:600;letter-spacing:.3px;padding:5px 12px;border-radius:8px;margin:12px 0 10px;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.unread{align-self:stretch;text-align:center;background:var(--white);color:var(--gray);font-size:12px;font-weight:600;letter-spacing:.3px;padding:6px;border-radius:8px;margin:10px 0}
.m{display:flex;align-items:flex-end;gap:8px;max-width:64%}
.m.run{margin-top:0}.m.first{margin-top:10px}
.m .av{align-self:flex-end}
.m .sp{width:28px;flex:none}
.bub{position:relative;background:var(--white);border-radius:10px;padding:6px 10px 7px;box-shadow:0 1px 0 rgba(0,0,0,.06);min-width:60px}
.m.first .bub{border-top-left-radius:2px}
.bub .name{font-size:13px;font-weight:600;display:block;margin-bottom:1px}
.bub .txt{display:inline;white-space:pre-wrap;word-wrap:break-word}
.bub .time{display:inline-block;font-size:11px;color:var(--faint);margin-left:10px;transform:translateY(3px);white-space:nowrap}
.bub .photo{display:block;width:240px;height:176px;border-radius:8px;overflow:hidden;margin:2px 0 4px}
.bub .photo svg{display:block;width:100%;height:100%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m.me .bub{background:var(--me);color:var(--me-ink)}
.m.me.first .bub{border-top-left-radius:10px;border-top-right-radius:2px}
.m.me .time{color:rgba(255,255,255,.75)}
.reacts{display:flex;gap:4px;margin-top:-4px;margin-left:36px;margin-bottom:4px}
.m.me+.reacts{align-self:flex-end;margin-left:0;margin-right:0}
.react{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:1px 7px;font-size:12px;color:var(--gray);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.react span{font-size:13px}
.seen{align-self:flex-end;font-size:11px;color:var(--faint);margin:-2px 2px 4px}
.typing .bub{padding:10px 12px;display:flex;gap:4px;align-items:center}
.typing .bub .name{margin:0 6px 0 0}
.dot{width:7px;height:7px;border-radius:50%;background:#b0bac2;animation:bounce 1s infinite}
.dot:nth-child(3){animation-delay:.15s}.dot:nth-child(4){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.pop{animation:pop .22s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.composer{height:62px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--field);border-top:1px solid var(--line)}
.composer .in{flex:1;height:40px;border-radius:8px;background:var(--white);display:flex;align-items:center;padding:0 14px;color:var(--faint);font-size:15px}

/* blur names + avatars (the "real screen record" look) */
html.blur .name,html.blur .av,html.blur .nm,html.blur .mem,html.blur .typing .name{filter:blur(4.5px)}
/* recording mode: no scrollbars */
html.rec .msgs{scrollbar-width:none}
html.rec .msgs::-webkit-scrollbar{display:none;width:0;height:0}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="sh" id="sh"></div>
    <div class="search" id="search"></div>
    <div class="chats" id="chats"></div>
  </aside>
  <main class="pane">
    <header class="ph" id="ph"></header>
    <div class="msgs" id="msgs"></div>
    <footer class="composer" id="composer"></footer>
  </main>
</div>

  /* ── the thread: yesterday's cake argument, today's re-asking ── */

  const LAST_CAKE = ["Rio", "wait what time again??", "8:24 AM"]; // arrives live in rec mode

  /* ── the other thread (0:30): she pays, posts the receipt, and it gets buried ── */
  const T_RCPT = [

  // land live, ~550ms apart. None of them is about money. That is the joke.
  const ARRIVE = [

  const T = THREAD === "receipt" ? T_RCPT : T_CAKE;

  $("sh").innerHTML = `${av("you", 40)}<span class="ico">${I.compose}</span><span class="ico">${I.more}</span>`;
  $("search").innerHTML = `${I.search}<span>Search or start a new chat</span>`;
  $("chats").innerHTML = CHATS.map((c, i) => `<div class="chat${c.on ? " on" : ""}${c.un ? " un" : ""}" ${i === 0 ? 'id="crew"' : ""}>${av(c.g ? "group" : c.n.split(" ")[0], 48)}<div class="c"><div class="r1"><b class="nm">${c.n}</b><span class="t${c.un ? " on" : ""}">${c.t}</span></div><div class="r2"><span class="p">${c.p}</span>${c.un ? `<span class="badge">${c.un}</span>` : ""}</div></div></div>`).join("");

  /* ── header + composer ── */
  $("ph").innerHTML = `${av("group", 40)}<div class="c"><div class="title nm">${TITLE}</div><div class="mem">Maya, Jules, Sam, Rio, Kenji, Ash, You</div></div><span class="ico">${I.video}</span><span class="ico">${I.phone}</span><span class="ico">${I.search}</span><span class="ico">${I.more}</span>`;

  /* ── messages ── */
  const msgs = $("msgs");
  const el = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
  const bubble = (who, text, time, o = {}, first = true) => {
    const me = who === "you";
    const name = !me && first ? `<span class="name" style="color:${P[who]}">${who}</span>` : "";
    const pic = o.photo ? `<span class="photo">${photo[o.photo]}</span>` : "";
    const lead = first && !me ? av(who, 28) : `<span class="sp"></span>`;
    return `<div class="m${me ? " me" : ""}${first ? " first" : " run"}">${me ? "" : lead}<div class="bub">${name}${pic}<span class="txt">${text}</span><span class="time">${time}</span></div></div>` +
      (o.react ? `<div class="reacts${me ? " me" : ""}">${o.react.map(([e, n]) => `<span class="react"><span>${e}</span> ${n}</span>`).join("")}</div>` : "") +
      (o.seen ? `<div class="seen">${o.seen}</div>` : "");
  };
  let prev = null, html = "";
  for (const item of T) {
    if (!Array.isArray(item)) { html += item.day ? `<div class="day">${item.day.toUpperCase()}</div>` : `<div class="unread">${item.unread} UNREAD MESSAGES</div>`; prev = null; continue; }
    const [who, text, time, o] = item;
    html += bubble(who, text, time, o, who !== prev);
    prev = o && o.react ? null : who;
  }
  msgs.innerHTML = html;
  const typing = el(`<div class="m typing first">${av(LAST[0], 28)}<div class="bub"><span class="name" style="color:${P[LAST[0]]}">${LAST[0]}</span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>`);
  const last = el(bubble(...LAST));
  const bottom = () => { msgs.scrollTop = msgs.scrollHeight; };
  const crew = $("crew");
  const preview = (p, t) => { crew.querySelector(".p").textContent = p; crew.querySelector(".t").textContent = t; };

  if (!REC) {
    if (THREAD === "receipt") { for (const a of ARRIVE) msgs.append(el(bubble(...a))); }
    else msgs.append(last);
    preview(`${LAST[0]}: ${LAST[1]}`, LAST[2]); bottom(); return;
  }

  /* ── receipt loop: the photo starts at the bottom, just posted. Four replies
     land and it climbs. The pane is 994px and only ~300px of message arrives,
     so it cannot leave the frame — it ends in the top third with three people
     talking about anything but money. 0.3s hold → 3.2s climb → 2.4s hold. ── */
  if (THREAD === "receipt") {
    const rcpt = [...msgs.querySelectorAll(".photo")].pop().closest(".m"); // the receipt, not yesterday's cake
    const arrivals = ARRIVE.map(a => el(bubble(...a)));
    const AT = [700, 1250, 1800, 2300], DUR = 3200, HOLD = 2400;
    const ease = x => (x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
    const run = () => {
      for (const a of arrivals) { a.remove(); a.classList.remove("pop"); }
      const seen = rcpt.nextElementSibling; // the reacts row, then the seen row
      const foot = seen && seen.nextElementSibling ? seen.nextElementSibling : seen;
      const bottomOfPost = (foot || rcpt).offsetTop - msgs.offsetTop + (foot || rcpt).offsetHeight;
      const start = Math.max(0, Math.round(bottomOfPost - msgs.clientHeight + 14));
      msgs.scrollTop = start;
      preview("Kenji: she ate", "9:46 AM");
      const t0 = performance.now();
      let n = 0;
      const step = now => {
        const e = now - t0;
        while (n < arrivals.length && e >= AT[n]) {
          arrivals[n].classList.add("pop"); msgs.append(arrivals[n]);
          preview(`${ARRIVE[n][0]}: ${ARRIVE[n][1]}`, ARRIVE[n][2]); n++;
        }
        const max = msgs.scrollHeight - msgs.clientHeight;
        msgs.scrollTop = Math.round(start + (max - start) * ease(Math.min(1, e / DUR)));
        if (e < DUR + HOLD) requestAnimationFrame(step); else run();
      };
      requestAnimationFrame(step);
    };
    setTimeout(run, 300);
    return;
  }

  /* ── rec loop: 300ms hold → flick 0→bottom over 4s (linear, a thumb) → typing 900ms → last message lands → hold 2.5s → reset ── */
  const D = 4000;
  const run = () => {
    last.remove(); typing.remove(); last.classList.remove("pop");
    preview(`Ash: right`, "8:20 AM");
    msgs.scrollTop = 0;
    const max = msgs.scrollHeight - msgs.clientHeight;
    const t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / D);
      msgs.scrollTop = Math.round(max * p);
      if (p < 1) requestAnimationFrame(step);
      else {
        msgs.append(typing); bottom();
        setTimeout(() => {
          typing.remove(); last.classList.add("pop"); msgs.append(last); bottom();
          preview(`${LAST[0]}: ${LAST[1]}`, LAST[2]);
          setTimeout(run, 2500);
        }, 900);
      }
    };
    requestAnimationFrame(step);
  };
  setTimeout(run, 300);
})();
