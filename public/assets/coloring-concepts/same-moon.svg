<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Same moon paint-by-number concept</title>
  <desc id="desc">Two colorful lounge chairs and travel mugs beneath one moon, built from closed SVG regions.</desc>
  <style>
    .outline { stroke: hsl(240 10% 5%); stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }
    .thin { stroke: hsl(240 10% 5%); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .number { fill: hsl(240 10% 5%); font: 700 32px system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
  </style>
  <rect width="800" height="600" rx="18" fill="hsl(226 78% 18%)"/>
  <rect x="25" y="24" width="750" height="552" rx="10" fill="hsl(45 70% 90%)" class="outline"/>
  <path d="M54 52H746V350H54Z" fill="hsl(224 79% 42%)" class="outline" data-region="sky"/>
