  <path d="M52 477L746 477M233 350L177 548M568 350L624 548M400 350V548" fill="none" class="thin"/>
  <rect x="235" y="52" width="18" height="299" fill="hsl(42 88% 78%)" class="outline"/>
  <rect x="546" y="52" width="18" height="299" fill="hsl(42 88% 78%)" class="outline"/>
